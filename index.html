<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="총무앱">
<title>총무앱</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B3A6B;--sky:#4A90D9;--mint:#1D9E75;--amber:#E8A020;--red:#E53935;--pink:#E91E8C;--bg:#F4F6FA;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--border:#e5e7eb;--radius:14px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:72px}
.header{background:var(--navy);color:#fff;padding:48px 20px 20px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:flex-start}
.header h1{font-size:22px;font-weight:700}
.header-sub{font-size:13px;opacity:.7;margin-top:2px}
.header-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:10px 2px 9px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;font-size:11px;color:var(--text2);font-family:'Noto Sans KR',sans-serif;transition:color .2s}
.tab-btn.active{color:var(--navy);font-weight:700}
.tab-icon{font-size:20px;line-height:1}
.page{display:none;padding:16px}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.section-label{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;margin:16px 0 8px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.badge-ok{background:#E1F5EE;color:#085041}
.badge-no{background:#FFEBEE;color:#B71C1C}
.badge-role{background:#EEF2FF;color:#3730a3}
.badge-plan{background:#FFF8E1;color:#7a5200}
.badge-done{background:#E1F5EE;color:#085041}
.badge-group{background:#E8F0FE;color:#1B3A6B;font-size:11px;padding:2px 7px}
.badge-bday{background:#FCE4EC;color:#880E4F;font-size:11px;padding:2px 7px}
.badge-exempt{background:#FFF8E1;color:#7a5200;font-size:11px;padding:2px 7px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.summary-card{background:rgba(255,255,255,.12);border-radius:var(--radius-sm);padding:12px}
.summary-val{font-size:26px;font-weight:700;color:#fff;line-height:1}
.summary-label{font-size:11px;color:rgba(255,255,255,.75);margin-top:3px}
.progress-bar{height:7px;border-radius:4px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:var(--mint);transition:width .4s}
.member-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.member-row:last-child{border-bottom:none;padding-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.av-a{background:#DBEAFE;color:#1e40af}.av-b{background:#D1FAE5;color:#065f46}
.av-c{background:#FEF3C7;color:#92400e}.av-d{background:#EDE9FE;color:#4c1d95}
.av-e{background:#FCE7F3;color:#9d174d}
.member-info{flex:1;min-width:0}
.member-name{font-size:14px;font-weight:700}
.member-sub{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-date-box{background:var(--navy);color:#fff;border-radius:var(--radius-sm);padding:6px 8px;text-align:center;min-width:42px;flex-shrink:0}
.event-day{font-size:20px;font-weight:700;line-height:1}
.event-month{font-size:11px;opacity:.8}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 40px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;display:block}
.form-input{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:'Noto Sans KR',sans-serif;background:#fff;color:var(--text);outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--sky)}
.form-select{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:'Noto Sans KR',sans-serif;background:#fff;color:var(--text);outline:none}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;padding:14px;background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:4px}
.btn-secondary{width:100%;padding:12px;background:var(--bg);color:var(--navy);border:1.5px solid var(--navy);border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:8px}
.btn-danger{background:#FFEBEE;color:var(--red);border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.fab{position:fixed;bottom:84px;right:calc(50% - 200px);width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(27,58,107,.35);z-index:150;transition:transform .15s}
.fab:active{transform:scale(.92)}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;color:var(--text2);background:#fff;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;font-weight:500}
.chip.sel{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1a1a2e;color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:8px}
.alert-box{background:#FFF3E0;border-left:4px solid var(--amber);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#7a5200}
.bday-card{background:linear-gradient(135deg,#FCE4EC,#F8BBD0);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid #F48FB1}
.settle-header{background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.settle-big{font-size:28px;font-weight:700;margin:4px 0}
.settle-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.settle-row:last-child{border-bottom:none}
.settle-total{display:flex;justify-content:space-between;padding:11px 0 0;font-size:15px;font-weight:700}
.expense-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.expense-row:last-child{border-bottom:none}
.copy-box{background:#F8F9FA;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-all;color:var(--text);margin-bottom:10px}
.tab-settle{display:flex;border:1.5px solid var(--navy);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px}
.tab-settle button{flex:1;padding:9px 4px;border:none;background:#fff;font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:var(--text2)}
.tab-settle button.active{background:var(--navy);color:#fff;font-weight:700}
.unpaid-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.unpaid-row:last-child{border-bottom:none}
.attend-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;font-size:13px;font-family:'Noto Sans KR',sans-serif;margin:3px;transition:all .15s;background:#fff;color:var(--text2)}
.attend-chip.sel{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.split-result{background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-top:8px}
.photo-thumb{width:72px;height:72px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer}
.photo-add-btn{width:72px;height:72px;border:2px dashed var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:var(--text2);font-size:11px;gap:2px}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.storage-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:4px}
.storage-fill{height:100%;border-radius:3px;transition:width .3s}
.att-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:6px}
.att-badge-j{background:#E8F0FE;color:#1B3A6B}
.att-badge-b{background:#FFF3E0;color:#B45309}
.rules-editor{width:100%;min-height:300px;padding:12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;border:1.5px solid var(--border);border-radius:var(--radius-sm);resize:vertical;line-height:1.8;color:var(--text);background:#fff;box-sizing:border-box}
.rules-editor:focus{outline:none;border-color:var(--navy)}
.rules-view{font-size:14px;line-height:1.9;white-space:pre-wrap;color:var(--text);padding:4px 0}
.rules-view .rule-chapter{font-size:15px;font-weight:700;color:var(--navy);margin-top:16px;margin-bottom:4px}
.event-detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.event-detail-row:last-child{border-bottom:none}
.dues-table{width:100%;border-collapse:collapse;font-size:12px}
.dues-table th{background:var(--navy);color:#fff;padding:8px 4px;text-align:center;font-weight:700;position:sticky;top:0;z-index:2}
.dues-table th:first-child{text-align:left;padding-left:8px;min-width:60px}
.dues-table td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--border)}
.dues-table td:first-child{text-align:left;padding-left:8px;font-weight:700;font-size:13px}
.dues-table tr:last-child td{border-bottom:none}
.dues-cell-ok{background:#E1F5EE;color:#085041;border-radius:4px;padding:2px 4px;font-size:11px;font-weight:700;display:block;line-height:1.4}
.dues-cell-no{background:#FFEBEE;color:#B71C1C;border-radius:4px;padding:2px 4px;font-size:11px;font-weight:700;display:block}
.dues-cell-exempt{background:#FFF8E1;color:#7a5200;border-radius:4px;padding:2px 4px;font-size:11px;font-weight:700;display:block}
.cell-menu{position:fixed;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:500;padding:8px;min-width:160px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.cell-menu-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;background:none;width:100%;font-family:'Noto Sans KR',sans-serif;color:var(--text)}
.cell-menu-item:active{background:var(--bg)}
.cell-menu-overlay{position:fixed;inset:0;z-index:499}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- 홈 -->
<div class="page active" id="page-home">
  <div class="header">
    <div class="header-top">
      <div><div class="header-sub" id="today-date"></div><h1>📋 총무 관리</h1></div>
      <button class="header-btn" onclick="openModal('modal-add-group')">＋</button>
    </div>
    <div class="summary-grid" style="margin-top:14px" id="home-summary"></div>
  </div>
  <div style="padding:16px">
    <div id="home-bday-alert"></div>
    <div id="home-backup-alert"></div>
    <div id="home-attend-prompt"></div>
    <div class="section-label">회비 수금 현황</div><div id="home-dues-summary"></div>
    <div class="section-label">다가오는 일정</div><div id="home-events"></div>
    <div class="section-label">미납 회원</div><div id="home-unpaid"></div>
  </div>
</div>

<!-- 회원 -->
<div class="page" id="page-members">
  <div class="header"><h1>👥 회원 명단</h1><div class="header-sub" id="member-count-label" style="margin-top:4px"></div></div>
  <div style="padding:16px"><div class="chip-row" id="member-group-chips"></div><div id="member-list"></div></div>
</div>

<!-- 회비 -->
<div class="page" id="page-dues">
  <div class="header">
    <div class="header-top">
      <div><h1>💰 회비 관리</h1><div class="header-sub" id="dues-month-label" style="margin-top:4px"></div></div>
      <button class="header-btn" onclick="toggleDuesView()" id="dues-view-btn" title="보기 전환">☰</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
      <div style="flex:1">
        <div style="font-size:11px;color:rgba(255,255,255,.7);margin-bottom:3px">시작 월</div>
        <input class="form-input" type="month" id="dues-start-month" onchange="renderDues()" style="padding:7px 10px;font-size:14px;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff">
      </div>
      <div style="color:rgba(255,255,255,.7);margin-top:14px">~</div>
      <div style="flex:1">
        <div style="font-size:11px;color:rgba(255,255,255,.7);margin-bottom:3px">종료 월</div>
        <input class="form-input" type="month" id="dues-end-month" onchange="renderDues()" style="padding:7px 10px;font-size:14px;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff">
      </div>
    </div>
  </div>
  <div style="padding:16px"><div class="chip-row" id="dues-group-chips"></div><div id="dues-list"></div></div>
</div>

<!-- 일정 -->
<div class="page" id="page-schedule">
  <div class="header">
    <h1>📅 모임 일정</h1>
    <div class="header-sub" style="margin-top:4px">일정 관리 · 1/N 정산</div>
  </div>
  <div style="padding:16px">
    <div class="tab-settle" style="margin-bottom:12px">
      <button class="active" onclick="setSchedTab('list',this)">📋 일정 목록</button>
      <button onclick="setSchedTab('split',this)">💸 1/N 정산</button>
      <button onclick="setSchedTab('attend',this)">✅ 참석</button>
    </div>
    <div id="sched-tab-list">
      <div class="chip-row" id="sched-group-chips"></div>
      <div id="schedule-list"></div>
    </div>
    <div id="sched-tab-split" style="display:none">
      <div id="split-content"></div>
    </div>
    <div id="sched-tab-attend" style="display:none">
      <div class="chip-row" id="att-group-chips"></div>
      <div class="chip-row" id="att-type-chips"></div>
      <div class="form-row" style="margin-bottom:12px">
        <div><div class="form-label">시작 월</div><input class="form-input" type="month" id="att-start" onchange="renderAttend()"></div>
        <div><div class="form-label">종료 월</div><input class="form-input" type="month" id="att-end" onchange="renderAttend()"></div>
      </div>
      <div id="att-content"></div>
    </div>
  </div>
</div>

<!-- 기념일 -->
<div class="page" id="page-birthday">
  <div class="header"><h1>🎉 기념일 관리</h1><div class="header-sub" style="margin-top:4px">생일 · 창립일 · 주요 기념일</div></div>
  <div style="padding:16px">
    <div id="bday-this-month"></div>
    <div id="bday-next-month"></div>
    <div id="anniv-list"></div>
    <div id="bday-all-list"></div>
  </div>
</div>

<!-- 결산 -->
<div class="page" id="page-settle">
  <div class="header"><h1>📊 월별 결산</h1><div class="header-sub" style="margin-top:4px">수입·지출 결산 및 공지 생성</div></div>
  <div style="padding:16px">
    <div class="form-row" style="margin-bottom:12px">
      <div><div class="form-label">모임 선택</div><select class="form-select" id="settle-group" onchange="renderSettle()"></select></div>
      <div>
        <div class="form-label">시작 월</div>
        <input class="form-input" type="month" id="settle-month-start" onchange="renderSettle()">
      </div>
      <div>
        <div class="form-label">종료 월</div>
        <input class="form-input" type="month" id="settle-month-end" onchange="renderSettle()">
      </div>
    </div>
    <div class="tab-settle">
      <button class="active" onclick="setSettleTab('summary',this)">요약</button>
      <button onclick="setSettleTab('expense',this)">수입·지출</button>
      <button onclick="setSettleTab('attend',this)">참석·지역</button>
      <button onclick="setSettleTab('notice',this)">공지 생성</button>
    </div>
    <div id="settle-content"></div>
  </div>
</div>

<!-- 회칙 -->
<div class="page" id="page-rules">
  <div class="header">
    <h1>📋 회칙</h1>
    <div class="header-sub" style="margin-top:4px">모임별 회칙 관리</div>
  </div>
  <div style="padding:16px">
    <div class="chip-row" id="rules-group-chips"></div>
    <div id="rules-content"></div>
  </div>
</div>

<!-- 모임관리 -->
<div class="page" id="page-groups">
  <div class="header"><h1>⚙️ 모임 관리</h1><div class="header-sub" style="margin-top:4px">모임 추가 · 수정 · 삭제</div></div>
  <div style="padding:16px">
    <button onclick="renderBackupInfo();openModal('modal-backup')" style="width:100%;padding:13px;background:#E8F0FE;color:#1B3A6B;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px">💾 데이터 백업 / 복원</button>
    <div id="groups-storage"></div>
    <div id="groups-list"></div>
  </div>
</div>

<!-- 탭바 -->
<div class="tabbar">
  <button class="tab-btn active" data-page="home" onclick="showPage('home')"><span class="tab-icon">🏠</span>홈</button>
  <button class="tab-btn" data-page="members" onclick="showPage('members')"><span class="tab-icon">👥</span>회원</button>
  <button class="tab-btn" data-page="dues" onclick="showPage('dues')"><span class="tab-icon">💰</span>회비</button>
  <button class="tab-btn" data-page="schedule" onclick="showPage('schedule')"><span class="tab-icon">📅
